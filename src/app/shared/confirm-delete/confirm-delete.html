<!--
  Body of the "Delete X?" dialog. See confirm-delete.ts for how it is opened.

  The three `mat-dialog-*` directives give Material the parts it needs to wire
  accessibility: the title becomes the dialog's accessible name
  (`aria-labelledby` on the container), the content scrolls independently,
  and the actions row is pinned to the bottom.
-->
<h2 mat-dialog-title>Delete {{ data.name }}?</h2>
<mat-dialog-content>This action cannot be undone.</mat-dialog-content>
<mat-dialog-actions align="end">
  <!--
    `mat-dialog-close` with no value closes the dialog with an empty string
    (the attribute's value), which callers treat as "not confirmed".
    `cdkFocusInitial` puts keyboard focus on Cancel when the dialog opens, so
    pressing Enter by reflex never deletes anything.
  -->
  <button mat-button mat-dialog-close cdkFocusInitial>Cancel</button>
  <!-- `[mat-dialog-close]="true"` closes and resolves `afterClosed()` with true. -->
  <button mat-button [mat-dialog-close]="true">Delete</button>
</mat-dialog-actions>
